services:
  yii2-log-request-response-php:
    build:
      context: .
      dockerfile: "php.dev.Dockerfile"
      target: development
    volumes:
      - "test-app:/var/www/html"
      - "./:/package-src:ro"
    extra_hosts:
      - "host.docker.internal:host-gateway"

  yii2-log-request-response-nginx:
    image: "nginx:1.30.6-alpine"
    ports:
      - "${HOST_NGINX_PORT:-8080}:80"
    volumes:
      - "test-app:/var/www/html:ro"
      - "./deploy/data/nginx/root/etc/nginx/nginx.conf:/etc/nginx/nginx.conf:ro"
      - "./deploy/data/nginx/root/etc/nginx/fastcgi_params:/etc/nginx/fastcgi_params:ro"
      - "./deploy/data/nginx/root/etc/nginx/conf.d:/etc/nginx/conf.d:ro"
    depends_on:
      - "yii2-log-request-response-php"

volumes:
  test-app:
